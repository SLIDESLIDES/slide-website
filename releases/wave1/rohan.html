<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>print.</title>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .export-page {
      position: relative;
      width: 1440px;
      min-width: 1440px;
      min-height: 1600px;
      margin: 0 auto;
      background: #ffffff;
      overflow: hidden;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active { display: flex; }

    .modal-box {
      background: #fff;
      border-radius: 6px;
      padding: 20px;
      max-width: 700px;
      width: 90%;
      text-align: center;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 10px; right: 14px;
      font-size: 24px;
      cursor: pointer;
      color: #6b7280;
      background: none;
      border: none;
      line-height: 1;
    }

    .modal-img {
      width: 100%;
      max-height: 600px;
      object-fit: contain;
      border-radius: 4px;
      display: block;
    }

    .modal-label {
      font-size: 14px;
      color: #374151;
      margin: 10px 0 0 0;
    }

    .clickable {
      cursor: pointer;
    }
    .clickable:hover {
      opacity: 0.75;
    }

    canvas {
      pointer-events: none;
    }
  </style>
</head>

<body>

<div class="export-page">

  <p style="position:absolute;left:649.233px;top:1560px;font-size:10px;color:#374151;margin:0;">
    © 2026 Rohan Rai
  </p>

  <p class="clickable" onclick="openModal('pt1')" style="position:absolute;left:168.965px;top:350.972px;font-family:system-ui;font-size:35px;color:#374151;margin:0;">pt. 1</p>
  <p class="clickable" onclick="openModal('pt2')" style="position:absolute;left:611.361px;top:349.396px;font-family:system-ui;font-size:40px;color:#374151;margin:0;">pt. 2</p>
  <p class="clickable" onclick="openModal('pt3')" style="position:absolute;left:1204.75px;top:352.757px;font-size:23px;color:#374151;margin:0;">pt. 3</p>

  <!-- FOG CANVAS -->
  <div style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:900;pointer-events:none;">
    <canvas id="noiseCanvas"></canvas>
  </div>

  <p class="clickable" onclick="openModal('n1')" style="position:absolute;left:264.323px;top:976.111px;font-size:40px;">1</p>
  <p class="clickable" onclick="openModal('n2')" style="position:absolute;left:363.618px;top:1170.41px;font-size:40px;">2</p>
  <p class="clickable" onclick="openModal('n3')" style="position:absolute;left:346.326px;top:1395.11px;font-size:40px;">3</p>

  <div class="clickable" onclick="openModal('sq1')" style="position:absolute;left:942.695px;top:982.49px;width:100px;height:100px;background:#545e89;"></div>
  <div class="clickable" onclick="openModal('sq2')" style="position:absolute;left:868.813px;top:1223.65px;width:100px;height:100px;background:#5a4546;"></div>
  <div class="clickable" onclick="openModal('sq3')" style="position:absolute;left:1234.9px;top:1356.66px;width:100px;height:100px;background:#525152;"></div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">×</button>
    <p class="modal-label" id="modalLabel"></p>
    <img class="modal-img" id="modalImg">
  </div>
</div>

<script>

/* =========================
   MODAL (UNCHANGED)
========================= */
const images = {
  pt1: '../../images/wave1/rohan/piece 1/pt 1.png',
  pt2: '../../images/wave1/rohan/piece 1/pt 2.png',
  pt3: '../../images/wave1/rohan/piece 1/pt 3.png',
  n1: '../../images/wave1/rohan/piece 2/ud 1.png',
  n2: '../../images/wave1/rohan/piece 2/ud 2.png',
  n3: '../../images/wave1/rohan/piece 2/ud 3.png',
  sq1: '../../images/wave1/rohan/piece 2/ud 1 (wb).png',
  sq2: '../../images/wave1/rohan/piece 2/ud 2 (wb).png',
  sq3: '../../images/wave1/rohan/piece 2/ud 2 (wb).png',
};

const labels = {
  pt1:'pt. 1', pt2:'pt. 2', pt3:'pt. 3',
  n1:'ud 1', n2:'ud 2', n3:'ud 3',
  sq1:'ud 1 (wb)', sq2:'ud 2 (wb)', sq3:'ud 3 (wb)'
};

function openModal(slot) {
  document.getElementById('modalImg').src = images[slot];
  document.getElementById('modalLabel').textContent = labels[slot];
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  document.getElementById('modalImg').src = '';
}

/* =========================
   FOG SYSTEM (FINAL VERSION)
========================= */

const canvas = document.getElementById("noiseCanvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

/* mouse flashlight */
const mouse = { x: innerWidth/2, y: innerHeight/2 };
window.addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

/* scroll depth */
let scrollY = 0;
window.addEventListener("scroll", () => scrollY = window.scrollY);

/* fog */
const fog = Array.from({length: 260}, () => ({
  x: Math.random(),
  y: Math.random(),
  vx: (Math.random()-0.5)*0.0004,
  vy: (Math.random()-0.5)*0.0004,
  r: 150 + Math.random()*500,
  a: 0.02 + Math.random()*0.06,
  w: Math.random()*1000
}));

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  /* dark fog base */
  ctx.fillStyle = "rgba(0,0,0,0.68)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  /* fog */
  for (let f of fog) {
    f.x += f.vx;
    f.y += f.vy;

    if (f.x<0) f.x=1;
    if (f.x>1) f.x=0;
    if (f.y<0) f.y=1;
    if (f.y>1) f.y=0;

    const x = f.x*canvas.width;
    const y = f.y*canvas.height - scrollY*0.25 + Math.sin(f.w)*15;

    const g = ctx.createRadialGradient(x,y,0,x,y,f.r);
    g.addColorStop(0,`rgba(240,240,240,${f.a})`);
    g.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x,y,f.r,0,Math.PI*2);
    ctx.fill();
  }

  /* mouse light reveal */
  ctx.globalCompositeOperation = "destination-out";

  const glow = ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,100);
  glow.addColorStop(0,"rgba(0,0,0,0.6)");
  glow.addColorStop(1,"rgba(0,0,0,0)");

  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(mouse.x,mouse.y,180,0,Math.PI*2);
  ctx.fill();

  ctx.globalCompositeOperation = "source-over";

  requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
