<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>print.</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      font-family: 'Georgia', serif;
    }

    /* ── layout shell ── */
    .gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 60px 24px 48px;
    }

    /* ── wordmark ── */
    .wordmark {
      position: fixed;
      top: 28px;
      left: 36px;
      font-size: 13px;
      letter-spacing: 0.12em;
      color: #b0a99a;
      text-transform: lowercase;
      user-select: none;
    }

    /* ── main stage ── */
    .stage {
      display: flex;
      align-items: center;
      gap: 0;
      width: 100%;
      max-width: 1100px;
      justify-content: center;
    }

    /* ── painting frame ── */
    .frame {
      flex: 1 1 auto;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .painting-wrap {
      width: 100%;
      background: #f9f7f5;
      box-shadow:
        0 2px 6px rgba(0,0,0,0.07),
        0 12px 40px rgba(0,0,0,0.10),
        0 0 0 1px rgba(0,0,0,0.04);
      position: relative;
      overflow: hidden;
      /* subtle mount border, like a matte */
      padding: 18px;
    }

    .painting-wrap img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 72vh;
      object-fit: contain;
      transition: opacity 0.35s ease;
    }

    .painting-wrap img.fade {
      opacity: 0;
    }

    /* ── caption ── */
    .caption {
      font-size: 12px;
      letter-spacing: 0.18em;
      color: #b0a99a;
      text-transform: lowercase;
      text-align: center;
      height: 16px;
      transition: opacity 0.25s ease;
    }

    /* ── side nav buttons ── */
    .side-nav {
      flex: 0 0 72px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 12px 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .nav-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .nav-btn:hover .arrow-line {
      background: #374151;
    }

    .nav-btn:hover .nav-label {
      color: #374151;
    }

    /* tiny thumbnail */
    .nav-thumb {
      width: 38px;
      height: 38px;
      object-fit: cover;
      filter: grayscale(40%);
      opacity: 0.6;
      transition: opacity 0.2s, filter 0.2s;
      border: 1px solid #e5e5e5;
    }

    .nav-btn:hover .nav-thumb {
      opacity: 1;
      filter: grayscale(0%);
    }

    .nav-label {
      font-size: 10px;
      letter-spacing: 0.16em;
      color: #b0a99a;
      text-transform: lowercase;
      font-family: 'Georgia', serif;
      transition: color 0.2s;
    }

    /* ── pip dots ── */
    .pips {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .pip {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #d4cfc9;
      transition: background 0.25s;
    }

    .pip.active {
      background: #374151;
    }

    /* ── footer ── */
    footer {
      position: fixed;
      bottom: 22px;
      right: 32px;
      font-size: 10px;
      color: #c9c4be;
      letter-spacing: 0.1em;
    }

    @media (max-width: 640px) {
      .side-nav { flex: 0 0 44px; }
      .nav-thumb { width: 28px; height: 28px; }
      .painting-wrap { padding: 10px; }
    }
  </style>
</head>
<body>

<span class="wordmark">print.</span>

<main class="gallery">
  <div class="stage">

    <!-- LEFT nav -->
    <div class="side-nav" id="navLeft">
      <button class="nav-btn" id="btnLeft" onclick="go(-1)" aria-label="Previous">
        <img class="nav-thumb" id="thumbLeft" src="" alt="">
        <span class="nav-label" id="labelLeft"></span>
      </button>
    </div>

    <!-- painting -->
    <div class="frame">
      <div class="painting-wrap">
        <img id="mainImg" src="" alt="print artwork">
      </div>
      <p class="caption" id="caption"></p>
      <div class="pips">
        <div class="pip" data-i="0"></div>
        <div class="pip" data-i="1"></div>
        <div class="pip" data-i="2"></div>
      </div>
    </div>

    <!-- RIGHT nav -->
    <div class="side-nav" id="navRight">
      <button class="nav-btn" id="btnRight" onclick="go(1)" aria-label="Next">
        <img class="nav-thumb" id="thumbRight" src="" alt="">
        <span class="nav-label" id="labelRight"></span>
      </button>
    </div>

  </div>
</main>

<footer>© 2026 Rohan Rai</footer>

<script>
  const pieces = [
    {
      src:   '../../images/wave1/rohan/piece 1/pt 1.png',
      label: 'pt. 1',
      thumb: '../../images/wave1/rohan/piece 1/pt 1.png',
    },
    {
      src:   '../../images/wave1/rohan/piece 1/pt 2.png',
      label: 'pt. 2',
      thumb: '../../images/wave1/rohan/piece 1/pt 2.png',
    },
    {
      src:   '../../images/wave1/rohan/piece 1/pt 3.png',
      label: 'pt. 3',
      thumb: '../../images/wave1/rohan/piece 1/pt 3.png',
    },
  ];

  // ud thumbnails shown in the nav buttons
  const udThumbs = [
    { src: '../../images/wave1/rohan/piece 2/ud 1.png', label: 'ud 1' },
    { src: '../../images/wave1/rohan/piece 2/ud 2.png', label: 'ud 2' },
    { src: '../../images/wave1/rohan/piece 2/ud 3.png', label: 'ud 3' },
  ];

  let current = 0;

  const mainImg   = document.getElementById('mainImg');
  const caption   = document.getElementById('caption');
  const btnLeft   = document.getElementById('btnLeft');
  const btnRight  = document.getElementById('btnRight');
  const thumbLeft = document.getElementById('thumbLeft');
  const thumbRight= document.getElementById('thumbRight');
  const labelLeft = document.getElementById('labelLeft');
  const labelRight= document.getElementById('labelRight');
  const pips      = document.querySelectorAll('.pip');

  function render(idx, dir) {
    const piece = pieces[idx];

    // fade out
    mainImg.classList.add('fade');
    caption.style.opacity = '0';

    setTimeout(() => {
      mainImg.src = piece.src;
      caption.textContent = piece.label;

      mainImg.onload = () => {
        mainImg.classList.remove('fade');
        caption.style.opacity = '1';
      };
      // fallback if image is cached (onload won't fire)
      if (mainImg.complete) {
        mainImg.classList.remove('fade');
        caption.style.opacity = '1';
      }
    }, 200);

    // pips
    pips.forEach(p => p.classList.toggle('active', +p.dataset.i === idx));

    // left button — shows ud thumb for the piece we're going back to
    if (idx > 0) {
      const prev = udThumbs[idx - 1];
      thumbLeft.src = prev.src;
      labelLeft.textContent = prev.label;
      btnLeft.classList.add('visible');
    } else {
      btnLeft.classList.remove('visible');
    }

    // right button — shows ud thumb for the piece we're going forward to
    if (idx < pieces.length - 1) {
      const next = udThumbs[idx + 1];
      thumbRight.src = next.src;
      labelRight.textContent = next.label;
      btnRight.classList.add('visible');
    } else {
      btnRight.classList.remove('visible');
    }
  }

  function go(dir) {
    const next = current + dir;
    if (next < 0 || next >= pieces.length) return;
    current = next;
    render(current, dir);
  }

  // keyboard support
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  go(-1);
    if (e.key === 'ArrowRight') go(1);
  });

  // init
  render(0, 1);
</script>
</body>
</html>
